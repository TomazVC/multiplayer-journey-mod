name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: sudo apt-get install -y zip
      - name: transport test (simulated lossy network)
        run: zig cc -O2 -o rtp_test test/rtp_test.c && ./rtp_test
      - run: sh ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: journey-coop
          path: dist/journey-coop.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/journey-coop.zip
          generate_release_notes: true
